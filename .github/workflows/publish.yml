# Publishes every library module to Maven Central as io.github.corneloaie:<module>:<forkVersion> when a GitHub release
# is published (its tag must be v<forkVersion>, see gradle.properties), or by hand. It needs the four repository
# secrets below; MAINTAINING.md has the one-time Sonatype Central Portal and GPG setup.

name: Publish

on:
  release:
    types: [ prereleased, released ]
  workflow_dispatch:

env:
  ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.SONATYPEUSERNAME }}
  ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.SONATYPEPASSWORD }}
  ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_PRIVATE_KEY }}
  ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.PASSPHRASE }}

jobs:
  publish:
    runs-on: macos-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.2.0'
      - name: Check the release tag against forkVersion
        if: github.event_name == 'release'
        run: |
          version=$(sed -n 's/^forkVersion=//p' gradle.properties)
          if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "::error::Release tag $GITHUB_REF_NAME does not match forkVersion=$version in gradle.properties"
            exit 1
          fi
      - name: Check the publishing secrets
        run: |
          for name in ORG_GRADLE_PROJECT_mavenCentralUsername ORG_GRADLE_PROJECT_mavenCentralPassword ORG_GRADLE_PROJECT_signingInMemoryKey ORG_GRADLE_PROJECT_signingInMemoryKeyPassword; do
            if [ -z "${!name}" ]; then echo "::error::Secret for $name is not set (see MAINTAINING.md)"; exit 1; fi
          done
      - name: Publish to Maven Central
        run: |
          for module in firebase-common firebase-common-internal firebase-app firebase-analytics firebase-appcheck firebase-auth firebase-config \
                        firebase-crashlytics firebase-database firebase-dataconnect firebase-firestore firebase-functions \
                        firebase-installations firebase-messaging firebase-perf firebase-storage; do
            echo "::group::$module"
            ./gradlew ":$module:publishToMavenCentral"
            echo "::endgroup::"
          done

  documentation:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.2.0'
      - name: Generate documentation
        run: ./gradlew dokkaHtmlMultiModule
      - name: Deploy API documentation to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: build/dokka/htmlMultiModule
          target-folder: docs
