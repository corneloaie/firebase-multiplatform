# Every Monday, keep this fork current, one pull request per concern:
#   1. "Weekly: merge upstream GitLive": GitLive's v3.0.0 line, plus updated heads of the upstream PR branches this fork
#      carries ahead of upstream (.github/upstream-merges.tsv).
#   2. "Weekly: Firebase SDK updates": the latest Firebase Android BoM, iOS SDK and JS SDK, and the Android API
#      reference the coverage reports compare against, with the reports and the README coverage table regenerated.
# A Claude Code routine on the maintainer's machine then implements the Android API members the update reports
# missing, fixes what the new SDKs or upstream changes broke, and gets both pull requests merged (MAINTAINING.md).
#
# GitHub holds the CI runs of these pull requests for approval while github-actions[bot] counts as a first-time
# contributor, and a workflow_dispatch run would not count (its checks do not show on the pull request), so each job
# approves its pull request's runs (.github/scripts/weekly/approve_ci.sh). A refreshed pull request has new content, so
# its auto-merge is turned off until it has been checked again.

name: Weekly update

on:
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write

concurrency:
  group: weekly-update

jobs:
  upstream:
    name: Merge upstream GitLive
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      # gh would otherwise pick the `upstream` remote (GitLive) that sync.sh adds
      GH_REPO: ${{ github.repository }}
      BRANCH: weekly/upstream-sync
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "$BRANCH"
      - name: Merge upstream
        id: sync
        run: |
          set +e
          .github/scripts/upstream/sync.sh "$RUNNER_TEMP/upstream.md"
          echo "exit=$?" >> "$GITHUB_OUTPUT"
          echo "ahead=$(git rev-list --count origin/main..HEAD)" >> "$GITHUB_OUTPUT"
          cat "$RUNNER_TEMP/upstream.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Open or update the pull request
        if: steps.sync.outputs.ahead != '0'
        run: |
          state=$(gh pr view "$BRANCH" --json state --jq .state 2>/dev/null || true)
          if [ "$state" = OPEN ]; then gh pr merge "$BRANCH" --disable-auto >/dev/null 2>&1 || true; fi
          git push --force origin "$BRANCH"
          if [ "$state" = OPEN ]; then
            gh pr edit "$BRANCH" --body-file "$RUNNER_TEMP/upstream.md"
          else
            gh pr create --base main --head "$BRANCH" --title "Weekly: merge upstream GitLive" --body-file "$RUNNER_TEMP/upstream.md"
          fi
          .github/scripts/weekly/approve_ci.sh "$(git rev-parse HEAD)"
      - name: Report the merges that need a hand
        if: steps.sync.outputs.exit == '3'
        run: |
          title="Upstream GitLive changes need a manual merge"
          number=$(gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh issue comment "$number" --body-file "$RUNNER_TEMP/upstream.md"
          else
            gh issue create --title "$title" --body-file "$RUNNER_TEMP/upstream.md"
          fi

  firebase-sdks:
    name: Firebase SDK updates and API coverage
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      # pin gh to this repository, as in the upstream job
      GH_REPO: ${{ github.repository }}
      GITHUB_TOKEN: ${{ github.token }}
      BRANCH: weekly/firebase-sdks
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "$BRANCH"
      - name: Move to the latest Firebase SDKs
        id: versions
        run: |
          python3 .github/scripts/weekly/firebase_versions.py --write --summary "$RUNNER_TEMP/versions.md"
          cat "$RUNNER_TEMP/versions.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Regenerate the Android API references and coverage reports
        id: reports
        if: steps.versions.outputs.changed == 'true'
        continue-on-error: true
        run: |
          ./gradlew --continue updateAndroidSdkApi
          # the Firestore pipeline expressions, generated from the Android SDK's sources at the new ref; a function the
          # generator cannot translate must not keep the other modules' reports from being regenerated
          python3 firebase-firestore/codegen/generate_pipeline.py || echo "::warning::firebase-firestore/codegen/generate_pipeline.py needs an override for a new pipeline function"
          ./gradlew --continue androidSourceCompatDump
      - name: Summarise the coverage
        if: steps.versions.outputs.changed == 'true'
        run: |
          python3 .github/scripts/weekly/coverage.py --readme README.md --compare origin/main --summary "$RUNNER_TEMP/coverage.md" > /dev/null
          {
            cat "$RUNNER_TEMP/versions.md"
            echo
            if [ "${{ steps.reports.outcome }}" != success ]; then
              echo "> [!WARNING]"
              echo "> Regenerating the coverage reports failed (see the workflow run): the new SDKs probably broke the Android build. The coverage below is from the modules that still built."
              echo
            fi
            cat "$RUNNER_TEMP/coverage.md"
          } > "$RUNNER_TEMP/body.md"
          cat "$RUNNER_TEMP/coverage.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Open or update the pull request
        if: steps.versions.outputs.changed == 'true'
        run: |
          git add -A
          git commit -q -m "Weekly Firebase SDK update" -m "$(cat "$RUNNER_TEMP/versions.md")"
          state=$(gh pr view "$BRANCH" --json state --jq .state 2>/dev/null || true)
          if [ "$state" = OPEN ]; then gh pr merge "$BRANCH" --disable-auto >/dev/null 2>&1 || true; fi
          git push --force origin "$BRANCH"
          if [ "$state" = OPEN ]; then
            gh pr edit "$BRANCH" --body-file "$RUNNER_TEMP/body.md"
          else
            gh pr create --base main --head "$BRANCH" --title "Weekly: Firebase SDK updates" --body-file "$RUNNER_TEMP/body.md"
          fi
          .github/scripts/weekly/approve_ci.sh "$(git rev-parse HEAD)"
