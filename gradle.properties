android.enableJetifier=true
android.useAndroidX=true
kapt.use.worker.api=true
kotlin.code.style=official
kotlin.incremental.multiplatform=true
kotlin.js.compiler=ir
kotlin.js.experimental.generateKotlinExternals=false
#kotlin.mpp.enableCompatibilityMetadataVariant=true
#kotlin.mpp.enableGranularSourceSetsMetadata=true
kotlin.mpp.stability.nowarn=true
#kotlin.native.enableDependencyPropagation=false
kotlin.native.enableParallelExecutionCheck=false
kotlin.setJvmTargetFromAndroidCompileOptions=true
org.gradle.jvmargs=-Xmx8G -Dfile.encoding\=UTF-8 -XX:MaxMetaspaceSize=1024m -Dkotlin.daemon.jvm.options\=-Xmx8G,-XX:MaxMetaspaceSize=1024m
org.gradle.parallel=true
systemProp.org.gradle.internal.publish.checksums.insecure=true
testOptions.unitTests.isIncludeAndroidResources=true
kotlin.mpp.enableCInteropCommonization=true
kotlin.native.cacheKind=none

# supportedTargets=ios,macos,tvos,jvm,js,wasmjs,android
firebase-analytics.supportedTargets=ios,macos,tvos,jvm,js,wasmjs,android
firebase-app.supportedTargets=ios,macos,tvos,jvm,js,wasmjs,android
firebase-auth.supportedTargets=ios,tvos,jvm,js,wasmjs,android
firebase-common-internal.supportedTargets=ios,macos,tvos,jvm,js,wasmjs,android
firebase-common.supportedTargets=ios,macos,tvos,jvm,js,wasmjs,android
firebase-config.supportedTargets=ios,macos,tvos,jvm,js,wasmjs,android
firebase-crashlytics.supportedTargets=ios,macos,jvm,android
firebase-database.supportedTargets=ios,macos,tvos,jvm,js,wasmjs,android
firebase-dataconnect.supportedTargets=ios,tvos,js,android
firebase-firestore.supportedTargets=ios,macos,tvos,jvm,js,wasmjs,android
firebase-functions.supportedTargets=ios,macos,tvos,jvm,js,wasmjs,android
# In-App Messaging: the iOS SDK has it on iOS and tvOS only (API_UNAVAILABLE(macos)), there is no web SDK, and the JVM
# (firebase-java-sdk has none) gets no-op fallbacks.
firebase-inappmessaging.supportedTargets=ios,tvos,jvm,android
firebase-installations.supportedTargets=ios,macos,tvos,jvm,js,wasmjs,android
firebase-messaging.supportedTargets=ios,macos,tvos,jvm,js,wasmjs,android
firebase-perf.supportedTargets=ios,tvos,jvm,js,wasmjs,android
firebase-storage.supportedTargets=ios,macos,tvos,jvm,js,wasmjs,android
test-utils.supportedTargets=ios,macos,tvos,jvm,js,wasmjs,android

# supportedTestTargets=ios,macos,tvos,jvm,js,wasmjs,android
firebase-analytics.supportedTestTargets=js,wasmjs,android
firebase-app.supportedTestTargets=ios,tvos,jvm,js,wasmjs,android
firebase-auth.supportedTestTargets=ios,tvos,js,wasmjs,android
firebase-common-internal.supportedTestTargets=ios,macos,tvos,jvm,js,wasmjs,android
firebase-common.supportedTestTargets=ios,macos,tvos,jvm,js,wasmjs,android
firebase-config.supportedTestTargets=ios,macos,tvos,js,wasmjs,android
firebase-crashlytics.supportedTestTargets=ios,macos,android
firebase-database.supportedTestTargets=ios,macos,tvos,jvm,js,wasmjs,android
firebase-dataconnect.supportedTestTargets=ios,tvos,js,android
firebase-firestore.supportedTestTargets=ios,macos,tvos,jvm,js,wasmjs,android
firebase-functions.supportedTestTargets=ios,macos,tvos,jvm,js,wasmjs,android
firebase-inappmessaging.supportedTestTargets=ios,tvos,jvm,android
# No macos: the Installations SDK keeps its id in the data protection keychain, which a macOS test binary can only
# use when signed with a provisioning profile, so getId/getToken/delete fail with SecItemAdd (-34018) there.
firebase-installations.supportedTestTargets=ios,tvos,js,wasmjs,android
firebase-messaging.supportedTestTargets=ios,macos,tvos,jvm,js,wasmjs,android
firebase-perf.supportedTestTargets=ios,tvos,js,wasmjs,android
firebase-storage.supportedTestTargets=ios,js,wasmjs,android
test-utils.supportedTestTargets=ios,macos,tvos,jvm,js,wasmjs,android

# Version (applies to all modules):
# The 3.x line replaces cocoapods with swift package manager, which relies on kotlin's swiftpm
# support while that is still alpha. The 2.x line on master remains the stable cocoapods release.
version=3.0.0-alpha02

# firebase-android-sdk git ref the api/android-sdk/*.api.txt files are downloaded from (./gradlew updateAndroidSdkApi)
androidSdk.apiRef=3199128480a6619779fa2feda823922f10b91009

# The version this fork publishes under io.github.corneloaie (buildSrc fork/Fork.kt); `version` tracks upstream GitLive.
# Kept at the end of the file, away from upstream's lines, so upstream version bumps merge cleanly.
forkVersion=0.1.0
